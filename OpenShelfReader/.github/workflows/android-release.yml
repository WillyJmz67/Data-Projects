name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Calculate version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            VERSION_NAME="${RAW_VERSION#v}"
          else
            VERSION_NAME="nightly-$(date +'%Y%m%d-%H%M')"
          fi

          VERSION_CODE=$(git rev-list --count HEAD)

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openshelf.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/openshelf.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded."
          else
            echo "Keystore secret not found. APK will not be release-signed."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p dist

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/OpenShelfReader-$VERSION_NAME.apk"
          else
            echo "Release APK not found."
            exit 1
          fi

          cd dist
          sha256sum "OpenShelfReader-$VERSION_NAME.apk" > "OpenShelfReader-$VERSION_NAME.apk.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenShelfReader-${{ env.VERSION_NAME }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

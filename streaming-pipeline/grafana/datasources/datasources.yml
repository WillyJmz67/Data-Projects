apiVersion: 1

# The `uid` of each datasource is declared explicitly. Grafana otherwise
# assigns a random uid at provisioning time, and every dashboard panel that
# references a datasource by uid fails with
# "Datasource <uid> was not found".
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"

  - name: PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: streaming_metrics
    user: streaming_user
    secureJsonData:
      password: streaming_pass
    jsonData:
      sslmode: "disable"
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      timescaledb: false
    editable: false

  # MinIO / S3 datasource.
  #
  # Disabled on purpose: it requires the third-party plugin
  # `grafana-s3-datasource` to be installed (GF_INSTALL_PLUGINS in
  # docker-compose.yml), and Grafana refuses to provision a datasource whose
  # plugin is missing. No dashboard panel currently queries Parquet in MinIO -
  # they read Prometheus and PostgreSQL - so leaving it enabled only adds a
  # startup failure mode.
  #
  # To enable it:
  #   1. uncomment `GF_INSTALL_PLUGINS=grafana-s3-datasource` in docker-compose.yml
  #   2. uncomment the block below and check the plugin's expected field names
  #      (the secret key belongs in secureJsonData, not jsonData)
  #
  # - name: MinIO (S3)
  #   uid: minio
  #   type: grafana-s3-datasource
  #   access: proxy
  #   url: http://minio:9000
  #   jsonData:
  #     bucket: metrics
  #     region: us-east-1
  #     endpoint: http://minio:9000
  #     accessKey: minioadmin
  #   secureJsonData:
  #     secretKey: minioadmin123
  #   editable: false
